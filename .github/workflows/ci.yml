name: Build and Test

on: push

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      - uses: sbt/setup-sbt@v1
      - name: Run tests
        run: sbt +test
